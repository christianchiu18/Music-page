<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content = "width=device-width, initial-scale = 1.0">
        <title>Music utilities by Christian</title>

        <link rel="stylesheet" href="style.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.52/Tone.js" defer></script>
        <script src="script.js" defer></script>
        
    </head>
    <body>
        <section id = background>
            <div>
            <h1>Piano on the Web</h1>
            <p>Hello, I play the piano and I was wondering if I could play it on my computer,, so this website does exactly that</p>
            <p>
                Click <kbd>S</kbd> to make a middle C,and the following notes are the next keycaps.
                Your current scale is <kbd id = scale-value>4</kbd>
            </p>
            </div>
            <div id="piano">
                <span class="key" id="C"><strong>C</strong></span>
                <span class="key" id="D"><strong>D</strong></span>
                <span class="key" id="E"><strong>E</strong></span>
                <span class="key" id="F"><strong>F</strong></span>
                <span class="key" id="G"><strong>G</strong></span>
                <span class="key" id="A"><strong>A</strong></span>
                <span class="key" id="B"><strong>B</strong></span>
            </div>
        </section>
    
    </body>
</html>
